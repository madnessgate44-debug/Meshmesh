<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 32px; }
    h1 { color: #333; margin-bottom: 24px; text-align: center; font-size: 28px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #667eea; }
    button { padding: 12px 24px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: #f5f5f5; border-radius: 8px; }
    .task-item.completed .task-text { text-decoration: line-through; color: #999; }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #667eea; }
    .task-text { flex: 1; color: #333; font-size: 14px; }
    .delete-btn { background: #ff6b6b; padding: 8px 12px; font-size: 12px; border-radius: 6px; color: white; border: none; cursor: pointer; font-family: inherit; font-weight: 600; }
    .empty-state { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; padding-top: 24px; border-top: 2px solid #e0e0e0; }
    .stat { text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; color: #667eea; }
    .stat-label { font-size: 12px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Task Manager</h1>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button onclick="addTask()">Add</button>
    </div>
    <div class="task-list" id="taskList">
      <div class="empty-state">No tasks yet. Add one above to get started!</div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="completedCount">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('mm_tasks') || '[]');

    function saveTasks() {
      localStorage.setItem('mm_tasks', JSON.stringify(tasks));
      render();
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text: text, completed: false });
      input.value = '';
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(function(t) { return t.id !== id; });
      saveTasks();
    }

    function toggleTask(id) {
      var task = tasks.find(function(t) { return t.id === id; });
      if (task) task.completed = !task.completed;
      saveTasks();
    }

    function render() {
      var list = document.getElementById('taskList');
      var total = document.getElementById('totalCount');
      var completed = document.getElementById('completedCount');

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty-state">No tasks yet. Add one above to get started!</div>';
      } else {
        list.innerHTML = tasks.map(function(t) {
          return '<div class="task-item ' + (t.completed ? 'completed' : '') + '">' +
            '<input type="checkbox" ' + (t.completed ? 'checked' : '') + ' onchange="toggleTask(' + t.id + ')">' +
            '<span class="task-text">' + t.text + '</span>' +
            '<button class="delete-btn" onclick="deleteTask(' + t.id + ')">Delete</button>' +
          '</div>';
        }).join('');
      }

      total.textContent = tasks.length;
      completed.textContent = tasks.filter(function(t) { return t.completed; }).length;
    }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
