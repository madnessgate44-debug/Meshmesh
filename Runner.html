    <!-- Core App Logic -->
    <script>
        // Projects Schema definition
        const PROJECTS = {
            general: {
                id: 'general',
                name: 'Meshmesh Assistant',
                desc: 'General purpose workspace for conversational tasks.',
                icon: 'bot',
                systemPrompt: 'You are Meshmesh Assistant, a helpful and knowledgeable AI companion designed to provide direct, clear, and highly practical assistance.'
            },
            gahiz: {
                id: 'gahiz',
                name: 'Gahiz',
                desc: 'Business strategy & e-commerce intelligence system.',
                icon: 'briefcase',
                systemPrompt: 'You are Gahiz (جاهز), a strategic business, product, and e-commerce consultant. Help the user build highly tailored strategies, formulate tactical expansion schemes, refine supply chains, and design market entrance matrices. Prioritize deep local and global commercial realities, offering concrete steps and data-driven insights. Communicate fluently in Arabic or English, aligned perfectly with the user\'s tone.'
            },
            content_factory: {
                id: 'content_factory',
                name: 'Content Factory',
                desc: 'High-speed editorial strategy and marketing automation copywriting.',
                icon: 'factory',
                systemPrompt: 'You are Content Factory, an elite social copywriter, viral media designer, and persuasive editor. Your task is to turn thoughts into absolute high-performing posts (LinkedIn, Threads, Newsletter). Use frameworks like AIDA or PAS when appropriate. Write copy that captures reader attention inside the first 3 seconds. Focus on rhythm, structure, and emotional hooks.'
            },
            wired_leader: {
                id: 'wired_leader',
                name: 'Wired Leader',
                desc: 'Executive speech coach and corporate correspondence architecture.',
                icon: 'shield-alert',
                systemPrompt: 'You are Wired Leader, an executive speech trainer, senior diplomat, and organizational psychologist. Your job is to advise leaders on high-stakes crisis management, design premium strategic communications, and edit corporate emails for absolute authority, tact, and maximum impact. Provide precise structural adjustments to verbal and written communications.'
            }
        };

        // State initialization
        let activeProject = 'general';
        let conversations = JSON.parse(sessionStorage.getItem('meshmesh_chats')) || {};
        let activeProvider = sessionStorage.getItem('meshmesh_provider') || 'gemini';

        // Auto-initialize conversation arrays
        Object.keys(PROJECTS).forEach(pKey => {
            if (!conversations[pKey]) {
                conversations[pKey] = [];
            }
        });

        // Toggle Key Input Type (Show/Hide Secret)
        function toggleKeyVisibility(id) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        // Toggle mobile sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Initialize state indicators
        function updateConnectionIndicator() {
            const provider = document.getElementById('api-provider').value;
            const key = sessionStorage.getItem(`meshmesh_key_${provider}`);
            const indicator = document.getElementById('connection-indicator');
            const statusText = document.getElementById('connection-status-text');
            const warningBanner = document.getElementById('key-warning-banner');

            if (key && key.trim().length > 0) {
                indicator.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = `${provider.toUpperCase()} Key Active`;
                warningBanner.classList.add('hidden');
            } else {
                indicator.className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
                statusText.innerText = "Setup API Key to connect";
                warningBanner.classList.remove('hidden');
            }
        }

        // Switch Engine Provider
        function switchProvider(provider) {
            activeProvider = provider;
            sessionStorage.setItem('meshmesh_provider', provider);
            
            document.getElementById('gemini-key-container').classList.add('hidden');
            document.getElementById('claude-key-container').classList.add('hidden');
            
            if (provider === 'gemini') {
                document.getElementById('gemini-key-container').classList.remove('hidden');
                document.getElementById('provider-badge').innerText = 'Gemini 2.5';
            } else if (provider === 'claude') {
                document.getElementById('claude-key-container').classList.remove('hidden');
                document.getElementById('provider-badge').innerText = 'Claude 3.5';
            }
            updateConnectionIndicator();
        }

        // Save keys inside temporary sessionStorage sandbox
        function saveKey(provider, val) {
            sessionStorage.setItem(`meshmesh_key_${provider}`, val.trim());
            updateConnectionIndicator();
        }

        // Load keys back on startup
        function loadSavedKeys() {
            const geminiKey = sessionStorage.getItem('meshmesh_key_gemini') || '';
            const claudeKey = sessionStorage.getItem('meshmesh_key_claude') || '';
            
            document.getElementById('gemini-key-input').value = geminiKey;
            document.getElementById('claude-key-input').value = claudeKey;
            document.getElementById('api-provider').value = activeProvider;
            
            switchProvider(activeProvider);
        }

        // Build Project Sidebar list
        function renderProjectSidebar() {
            const listContainer = document.getElementById('project-list');
            listContainer.innerHTML = '';

            Object.values(PROJECTS).forEach(p => {
                const isActive = p.id === activeProject;
                const activeClasses = isActive 
                    ? 'bg-sky-500/10 text-sky-400 border-sky-500/20' 
                    : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border-transparent';

                const btn = document.createElement('button');
                btn.className = `w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium border transition-all ${activeClasses}`;
                btn.onclick = () => selectProject(p.id);
                btn.innerHTML = `
                    <div class="p-1.5 rounded-lg ${isActive ? 'bg-sky-500/15 text-sky-400' : 'bg-slate-950 text-slate-500'}">
                        <i data-lucide="${p.icon}" class="w-4 h-4"></i>
                    </div>
                    <div class="text-left flex-1 min-w-0">
                        <p class="truncate font-semibold text-xs text-slate-200">${p.name}</p>
                        <p class="truncate text-[10px] text-slate-500">${p.desc}</p>
                    </div>
                `;
                listContainer.appendChild(btn);
            });
            lucide.createIcons();
        }

        // Change workspace project
        function selectProject(projectId) {
            activeProject = projectId;
            const proj = PROJECTS[projectId];
            
            document.getElementById('current-project-title').innerHTML = `
                <i data-lucide="${proj.icon}" class="w-5 h-5 text-sky-400"></i>
                <span>${proj.name}</span>
            `;
            document.getElementById('current-project-desc').innerText = proj.desc;
            
            renderProjectSidebar();
            renderChatHistory();
            
            // On mobile devices auto-close sidebar
            if (window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        // Print chat messages inside panel window
        function renderChatHistory() {
            const container = document.getElementById('chat-messages');
            const messages = conversations[activeProject] || [];
            
            if (messages.length === 0) {
                // Render gorgeous Empty State Greeting
                const proj = PROJECTS[activeProject];
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center max-w-xl mx-auto text-center py-12 px-4">
                        <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-6 shadow-xl text-sky-400">
                            <i data-lucide="${proj.icon}" class="w-8 h-8"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-100 mb-2">Welcome to ${proj.name}</h3>
                        <p class="text-sm text-slate-400 leading-relaxed">${proj.desc}</p>
                        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                            <button onclick="useQuickPrompt('Provide a breakdown of standard operational procedures for this module.')" class="text-left p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 hover:bg-slate-800/50 transition-all text-xs text-slate-300">
                                <p class="font-medium text-slate-200 mb-1">Get Started</p>
                                <p class="text-slate-500">Provide a breakdown of standard procedures.</p>
                            </button>
                            <button onclick="useQuickPrompt('What are the key priorities to set up first when utilizing this assistant?')" class="text-left p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 hover:bg-slate-800/50 transition-all text-xs text-slate-300">
                                <p class="font-medium text-slate-200 mb-1">Key Priorities</p>
                                <p class="text-slate-500">What are the essential priorities to focus on?</p>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = '';
                messages.forEach((msg, idx) => {
                    const isUser = msg.role === 'user';
                    const wrapper = document.createElement('div');
                    wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full`;
                    
                    const bubble = document.createElement('div');
                    bubble.className = `max-w-[85%] sm:max-w-2xl rounded-2xl p-4 text-sm shadow-md transition-all ${
                        isUser 
                        ? 'bg-sky-600 text-white rounded-tr-none' 
                        : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'
                    }`;

                    // Transform simple markdown paragraphs/newlines for neat structure
                    const formattedText = formatMessageContent(msg.text);
                    bubble.innerHTML = `
                        <div class="prose prose-invert prose-sm max-w-none text-[13px] sm:text-sm leading-relaxed whitespace-pre-line">
                            ${formattedText}
                        </div>
                        <div class="text-[10px] mt-2 select-none ${isUser ? 'text-sky-200 text-right' : 'text-slate-500'}">
                            ${msg.timestamp}
                        </div>
                    `;
                    
                    wrapper.appendChild(bubble);
                    container.appendChild(wrapper);
                });
            }
            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
        }

        // Quick prompt click injection
        function useQuickPrompt(text) {
            document.getElementById('message-input').value = text;
            document.getElementById('message-input').focus();
        }

        // Simple Markdown formatter to render code blocks and line breaks cleanly
        function formatMessageContent(text) {
            // Escape html tags to avoid raw injection issues
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // Match code blocks ``` ... ```
            const codeBlockRegex = /```([\s\S]*?)```/g;
            escaped = escaped.replace(codeBlockRegex, (match, code) => {
                return `<pre class="bg-slate-950 border border-slate-800 rounded-xl p-3 my-2 text-xs font-mono text-slate-300 overflow-x-auto select-all">${code.trim()}</pre>`;
            });

            // Match inline code `...`
            escaped = escaped.replace(/`([^`\n]+)`/g, '<code class="bg-slate-950 px-1.5 py-0.5 rounded text-xs font-mono text-sky-400">$1</code>');

            return escaped;
        }

        // Exponential backoff executor for secure API direct execution
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    }
                    if (response.status !== 429 && response.status < 500) {
                        // Return errors early (like authentication/key issues)
                        return response;
                    }
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2; // Exponential expansion
            }
            throw new Error("Failed after maximum exponential retries.");
        }

        // Direct Core API Calling Pipeline
        async function executeAiGeneration(userQuery, systemPrompt) {
            const provider = activeProvider;
            const key = sessionStorage.getItem(`meshmesh_key_${provider}`);

            if (!key || key.trim() === '') {
                throw new Error("API Key is missing. Check your settings in the sidebar.");
            }

            if (provider === 'gemini') {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`;
                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const res = await fetchWithBackoff(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error?.message || "Google API returned an error status.");
                }

                const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!responseText) throw new Error("Empty response received from Gemini engine.");
                return responseText;
            } else if (provider === 'claude') {
                // Client-side execution of Anthropic Claude. Note: Direct browser connection requires proper handling or bypass of CORS.
                const url = 'https://api.anthropic.com/v1/messages';
                const payload = {
                    model: "claude-3-5-sonnet-20241022",
                    max_tokens: 4000,
                    system: systemPrompt,
                    messages: [
                        { role: "user", content: userQuery }
                    ]
                };

                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'anthropic-dangerous-direct-profiles-allowed': 'true' // Bypass built-in SDK console safeguards
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error?.message || "Anthropic API returned an error.");
                }

                const responseText = data.content?.[0]?.text;
                if (!responseText) throw new Error("Empty response received from Claude engine.");
                return responseText;
            }
        }

        // Handle Send message event
        async function handleSendMessage(event) {
            if (event) event.preventDefault();
            
            const inputElement = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-button');
            const query = inputElement.value.trim();
            
            if (!query) return;

            // Block execution if no key is entered
            const providerKey = sessionStorage.getItem(`meshmesh_key_${activeProvider}`);
            if (!providerKey) {
                document.getElementById('key-warning-banner').classList.remove('hidden');
                return;
            }

            // Lock Input Panel
            inputElement.value = '';
            inputElement.disabled = true;
            sendBtn.disabled = true;

            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Push User Message
            conversations[activeProject].push({
                role: 'user',
                text: query,
                timestamp: timestamp
            });
            renderChatHistory();

            // Inject Custom Temporary Loading Response State
            const container = document.getElementById('chat-messages');
            const loadingWrapper = document.createElement('div');
            loadingWrapper.id = 'meshmesh-loading-indicator';
            loadingWrapper.className = 'flex justify-start w-full';
            loadingWrapper.innerHTML = `
                <div class="max-w-[85%] sm:max-w-2xl rounded-2xl p-4 bg-slate-900 border border-slate-800 text-slate-400 rounded-tl-none">
                    <div class="flex items-center gap-2">
                        <div class="flex space-x-1.5">
                            <div class="w-2 h-2 bg-slate-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                            <div class="w-2 h-2 bg-slate-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                            <div class="w-2 h-2 bg-slate-500 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
                        </div>
                        <span class="text-xs text-slate-500 ml-1 font-mono">Meshmesh is processing...</span>
                    </div>
                </div>
            `;
            container.appendChild(loadingWrapper);
            container.scrollTop = container.scrollHeight;

            try {
                const systemPrompt = PROJECTS[activeProject].systemPrompt;
                const assistantResponse = await executeAiGeneration(query, systemPrompt);
                
                // Clear loading state
                const currentIndicator = document.getElementById('meshmesh-loading-indicator');
                if (currentIndicator) currentIndicator.remove();

                // Append real assistant payload
                conversations[activeProject].push({
                    role: 'assistant',
                    text: assistantResponse,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                // Commit history to sessionStorage for device sandboxing persistence
                sessionStorage.setItem('meshmesh_chats', JSON.stringify(conversations));

            } catch (err) {
                console.error(err);
                const currentIndicator = document.getElementById('meshmesh-loading-indicator');
                if (currentIndicator) currentIndicator.remove();

                // Inject beautiful error notification bubble inside chat
                conversations[activeProject].push({
                    role: 'assistant',
                    text: `❌ Error encountered during processing:\n\n${err.message}\n\nPlease check your API key, ensure you have sufficient balance/quota, and make sure network configuration supports standard API requests.`,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
            } finally {
                // Restore Input Panel state
                inputElement.disabled = false;
                sendBtn.disabled = false;
                renderChatHistory();
                inputElement.focus();
            }
        }

        // Watch for enter key within message textarea
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleSendMessage();
            }
        }

        // Clear only the currently selected workspace's local state
        function clearCurrentChat() {
            conversations[activeProject] = [];
            sessionStorage.setItem('meshmesh_chats', JSON.stringify(conversations));
            renderChatHistory();
        }

        // Delete completely all chat files
        function clearAllData() {
            Object.keys(conversations).forEach(k => {
                conversations[k] = [];
            });
            sessionStorage.setItem('meshmesh_chats', JSON.stringify(conversations));
            renderChatHistory();
        }

        // Window load routines
        window.addEventListener('load', () => {
            loadSavedKeys();
            selectProject(activeProject);
            updateConnectionIndicator();
        });
    </script>
</body>
</html>
