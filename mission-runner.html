<div class="mission-runner-module">
  <div class="card-title">🎯 Mission Runner</div>
  <div class="input-group">
    <label>Paste AI Response</label>
    <textarea id="aiResponseInput" rows="6" placeholder="Paste AI response with ```action-steps``` blocks..."></textarea>
  </div>
  <button class="btn btn-primary" onclick="extractActionsFromModule()">Extract Steps</button>
  <div id="extractedResults" style="margin-top: 16px;"></div>
</div>

<script>
function extractActionsFromModule() {
  const text = document.getElementById('aiResponseInput').value;
  const resultsDiv = document.getElementById('extractedResults');
  
  if (!text.trim()) {
    resultsDiv.innerHTML = '<div class="status-box error show">✗ Please paste an AI response</div>';
    return;
  }
  
  const regex = /```action-steps\s*([\s\S]*?)```/gi;
  const matches = [...text.matchAll(regex)];
  
  if (matches.length === 0) {
    resultsDiv.innerHTML = '<div class="status-box error show">✗ No ```action-steps``` blocks found</div>';
    return;
  }
  
  let html = '';
  matches.forEach((match, idx) => {
    const content = match[1].trim();
    const lines = content.split('\n').filter(l => l.trim().length > 0);
    html += `<div class="action-card" style="background:#f9f9f7; border:1px solid #e8e8e3; border-radius:12px; padding:16px; margin-bottom:12px;">
      <div style="font-weight:600; color:#7c3aed; margin-bottom:8px;">📌 Mission Block ${idx + 1}</div>
      <ul style="margin-left:20px; color:#374151; font-size:13px; line-height:1.6;">`;
    lines.forEach(line => {
      let cleaned = line.replace(/^[\s]*[-*•]?\s*\d*\.?\s*/, '').trim();
      if (cleaned) html += `<li>${escapeHtml(cleaned)}</li>`;
    });
    html += `</ul><div style="font-size:11px; color:#9ca3af; margin-top:8px;">📦 ${lines.length} step(s)</div></div>`;
  });
  
  resultsDiv.innerHTML = html;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
