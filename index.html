<!DOCTYPE html>

<title>Meshmesh</title>

<body>
<script>
// FIX: Proper downloadBlob with MIME type detection
function downloadBlob(content, filename) {
  var ext = (filename.split('.').pop() || '').toLowerCase();
  var mimeMap = {
    html:'text/html', htm:'text/html', json:'application/json',
    txt:'text/plain', js:'text/javascript', css:'text/css',
    md:'text/markdown', csv:'text/csv', xml:'application/xml'
  };
  var blob = new Blob([content], { type: mimeMap[ext] || 'text/plain' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
// Redirect to main app
window.location.replace('./App.html');
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=./App.html">
</noscript>
</body>
